[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todocli"
version = "0.1.0"
description = "A tiny, dependency-free command-line to-do list manager."
requires-python = ">=3.8"

[project.scripts]
todocli = "todocli.cli:main"

[tool.setuptools]
packages = ["todocli"]
